<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar(null)}"></header>

<main class="narrow">
    <h1>Sign in</h1>
    <p class="lede">Pick up where you left off.</p>

    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="notice notice-error" role="alert" th:if="${param.error}">
        Incorrect username or password.
    </div>
    <div class="notice notice-success" role="status" th:if="${param.logout}">
        You have been signed out.
    </div>

    <form class="card form" th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <p class="alt">New here? <a th:href="@{/register}">Create an account</a></p>
</main>
</body>
</html>
