<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar(null)}"></header>

<main class="narrow">
    <h1>Create your account</h1>
    <p class="lede">Your expenses stay private to you.</p>

    <form class="card form" th:action="@{/register}" th:object="${registerRequest}" method="post" novalidate>
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" th:field="*{username}" autocomplete="username" autofocus
                   th:classappend="${#fields.hasErrors('username')} ? 'invalid'">
            <p class="hint" th:unless="${#fields.hasErrors('username')}">4 to 30 characters.</p>
            <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Error</p>
        </div>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" autocomplete="email"
                   th:classappend="${#fields.hasErrors('email')} ? 'invalid'">
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</p>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}" autocomplete="new-password"
                   th:classappend="${#fields.hasErrors('password')} ? 'invalid'">
            <p class="hint" th:unless="${#fields.hasErrors('password')}">At least 6 characters.</p>
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</p>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="alt">Already registered? <a th:href="@{/login}">Sign in</a></p>
</main>
</body>
</html>
